<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>各種手続き</title>
<script>
function checkPassword() {
    const password = document.getElementById("password").value;

    if (password === "hokuriku") {
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
    } else {
        alert("パスワードが違います");
    }
}
</script>

<style>

body {
    font-family: sans-serif;
    background-color: #f5f7fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    text-align: center;
}

h1 {
    color: #003366;
}

input[type="password"] {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: 16px;
}

button {
    background-color: #0066cc;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #0050a0;
}

#content {
    display: none;
}

</style>

</head>
<body>

<div id="login" class="container">
    <h1>各種手続き</h1>

    <p>
        パスワードを入力してください
    </p>

    <input type="password" id="password">

    <button onclick="checkPassword()">
        ログイン
    </button>
</div>

<div id="content" class="container">
    <h1>ようこそ</h1>

    <p>
        認証に成功しました。
    </p>

    <p>
        ここに会員向け情報を掲載できます。
    </p>
</div>

</body>
</html>
